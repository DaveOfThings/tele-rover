[package]
name = "tele-rover"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
rumqttc = "0.25.1"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.13"
